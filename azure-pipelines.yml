pool:
  vmImage: 'macos-latest'

variables:
  flutterVersion: 'stable'  # Use 'stable' or a specific version like '3.5.0'
  buildConfiguration: 'Release'  # Build configuration (Debug, Release)

steps:
# Install Flutter
- script: |
    git clone --branch $(flutterVersion) --depth 1 https://github.com/flutter/flutter.git $(Pipeline.Workspace)/flutter
    echo '##vso[task.prependpath]$(Pipeline.Workspace)/flutter/bin'
    export PATH=$(Pipeline.Workspace)/flutter/bin:$PATH
    chmod +x $(Pipeline.Workspace)/flutter/bin/flutter
    flutter doctor
  displayName: 'Install Flutter'

# Clean Previous Builds
- script: flutter clean
  displayName: 'Clean Previous Builds'

# Install Dependencies
- script: flutter pub get
  displayName: 'Install Dependencies'

# Build iOS App
- script: |
    flutter build ios --release --no-codesign
  displayName: 'Build iOS App (Unsigned)'

# Archive the App using Xcodebuild
- script: |
    mkdir -p $(Pipeline.Workspace)/ios-build
    xcodebuild -workspace ios/Runner.xcworkspace \
      -scheme Runner \
      -configuration $(buildConfiguration) \
      -archivePath $(Pipeline.Workspace)/ios-build/Runner.xcarchive \
      archive
  displayName: 'Archive iOS App'

# Export IPA Using Xcodebuild
- script: |
    mkdir -p $(Pipeline.Workspace)/ios-artifacts
    xcodebuild -exportArchive \
      -archivePath $(Pipeline.Workspace)/ios-build/Runner.xcarchive \
      -exportPath $(Pipeline.Workspace)/ios-artifacts \
      -exportOptionsPlist ios/ExportOptions.plist
  displayName: 'Export IPA'

# Publish IPA as Build Artifact
- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: '$(Pipeline.Workspace)/ios-artifacts'
    artifactName: 'iOSIPA'
    publishLocation: 'Container'
  displayName: 'Publish iOS IPA Artifact'
