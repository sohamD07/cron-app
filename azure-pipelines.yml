pool:
  vmImage: 'macos-latest'

variables:
  flutterVersion: '3.27.1'  # Specify the Flutter version tag
  buildConfiguration: 'Release'  # Build configuration (Debug, Release)

steps:
# Install Flutter
- script: |
    git clone --branch $(flutterVersion) --depth 1 https://github.com/flutter/flutter.git
    export PATH=$(Pipeline.Workspace)/flutter/bin:$PATH
    echo '##vso[task.prependpath]$(Pipeline.Workspace)/flutter/bin'
    flutter doctor
  displayName: 'Install Flutter'

# Clean Previous Builds
- script: flutter clean
  displayName: 'Clean Previous Builds'

# Install Dependencies
- script: flutter pub get
  displayName: 'Install Dependencies'

# Install iOS CocoaPods Dependencies
# - script: |
#     cd ios
#     pod install
#   displayName: 'Install CocoaPods Dependencies'

# Build iOS App Without Signing
- script: |
    flutter build ios --release --no-codesign
  displayName: 'Build iOS App (Unsigned)'
